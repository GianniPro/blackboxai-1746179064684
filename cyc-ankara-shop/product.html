<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CYC Ankara - Product</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-poppins text-black">
  <header class="bg-black shadow">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center animate-slide-in-left">
      <h1 class="text-2xl font-bold text-white">CYC Ankara</h1>
      <nav class="space-x-6 text-lg">
        <a href="index.html" class="hover:text-gray-400 text-white">Home</a>
        <a href="materials.html" class="hover:text-gray-400 text-white">Materials</a>
        <a href="checkout.html" class="hover:text-gray-400 text-white">Checkout</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-6 py-16 max-w-4xl">
    <h2 id="material-name" class="text-4xl font-extrabold mb-6 text-center">Material</h2>
    <div class="bg-white rounded-lg shadow p-8">
      <img id="material-image" src="" alt="Material image" class="mx-auto mb-6 rounded max-h-64 object-contain" />
      <p class="mb-4 text-gray-800" id="material-description">Description of the material.</p>
      <div class="mb-6">
        <label for="size" class="block font-semibold mb-2">Select size (yards):</label>
        <select id="size" class="border border-black rounded px-3 py-2 w-full max-w-xs">
          <!-- Options 1 to 12 will be added by JS -->
        </select>
      </div>
      <div class="mb-6">
        <p class="text-lg font-semibold">Price: <span id="price">₦0.00</span></p>
        <p class="text-sm text-gray-600 mt-1">Currency: 
          <select id="currency" class="border border-black rounded px-2 py-1">
            <option value="NGN" selected>Naira (₦)</option>
            <option value="USD">Dollar ($)</option>
            <option value="GBP">Pound (£)</option>
            <option value="EUR">Euro (€)</option>
          </select>
        </p>
      </div>
      <button id="add-to-cart" class="bg-black text-white px-6 py-3 rounded-lg font-semibold hover:bg-gray-800 transition mb-6">
        Add to Cart
      </button>
      <a href="checkout.html" id="checkout-link" class="inline-block bg-black text-white px-6 py-3 rounded-lg font-semibold hover:bg-gray-800 transition">
        Proceed to Checkout
      </a>
    </div>

    <section class="mt-16">
      <h3 class="text-2xl font-bold mb-6">Suggested Materials</h3>
      <div id="suggested-materials" class="grid grid-cols-2 sm:grid-cols-4 gap-6">
        <!-- Suggested materials will be populated by JS -->
      </div>
    </section>
  </main>

  <footer class="bg-gray-100 border-t mt-20 py-6 text-center text-gray-600 text-sm">
    &copy; 2024 CYC Ankara. All rights reserved.
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
